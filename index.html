<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبورد اتوترید</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151d2a;
            --accent-blue: #0088cc;
            --green: #00e676;
            --text-color: #ffffff;
            --sub-text: #7f8c8d;
        }
        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 1px solid #222f3e;
        }
        .balance-title {
            font-size: 13px;
            color: var(--sub-text);
        }
        .balance-val {
            font-size: 30px;
            font-weight: bold;
            margin: 8px 0;
            color: #fff;
        }
        .badge {
            background-color: rgba(0, 230, 118, 0.15);
            color: var(--green);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
        }
        .btn-main {
            width: 100%;
            background: linear-gradient(135deg, #0088cc, #0055ff);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            margin-top: 15px;
            cursor: pointer;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .sub-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 12px;
            border: 1px solid #222f3e;
        }
        .sub-val {
            font-size: 18px;
            font-weight: bold;
            color: var(--green);
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h3 id="user-name">ربات معامله‌گر خودکار</h3>
    </div>

    <div class="card">
        <div class="balance-title">موجودی کل حساب</div>
        <div class="balance-val" id="balance">$1,000.00</div>
        <span class="badge" id="profit-percent">+0.0% سود</span>
        <button class="btn-main" onclick="toggleBot()">شروع / توقف ربات</button>
    </div>

    <div class="grid">
        <div class="sub-card">
            <div class="balance-title">سود امروز</div>
            <div class="sub-val" id="today-profit">$0.00</div>
        </div>
        <div class="sub-card">
            <div class="balance-title">معاملات فعال</div>
            <div class="sub-val" style="color: #0088cc;" id="active-trades">0</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // سنجاق کردن به کل صفحه

        // نمایش نام کاربر تلگرام
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('user-name').innerText = "خوش آمدی " + tg.initDataUnsafe.user.first_name;
        }

        let isRunning = false;
        function toggleBot() {
            isRunning = !isRunning;
            if(isRunning) {
                tg.showAlert("ربات معامله‌گر با موفقیت فعال شد 🚀");
            } else {
                tg.showAlert("ربات معامله‌گر متوقف شد 🛑");
            }
        }
    </script>
</body>
</html>
