<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>معامله‌گر خودکار بهروز</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0b131b;
            --card-bg: #15222e;
            --border-color: #1e2d3b;
            --text-main: #ffffff;
            --text-sub: #8a9ba8;
            --accent-blue: #0088cc;
            --btn-gradient: linear-gradient(135deg, #0088cc, #005588);
            --green: #00c853;
            --red: #ff3d00;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
        }

        /* Top Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            background: rgba(21, 34, 46, 0.5);
            border-bottom: 1px solid var(--border-color);
        }
        .header-title {
            font-size: 1.1rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dashboard-title-section {
            padding: 16px 16px 8px;
        }
        .dashboard-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin: 0;
        }

        /* Main Container */
        .container {
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Balance Card */
        .balance-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        .balance-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-sub);
            font-size: 0.85rem;
            margin-bottom: 8px;
        }
        .balance-value {
            font-size: 2.2rem;
            font-weight: bold;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }
        .balance-irr {
            font-size: 0.9rem;
            color: var(--text-sub);
            margin-bottom: 12px;
        }
        .balance-badges {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
        }
        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .badge-green {
            background: rgba(0, 200, 83, 0.15);
            color: var(--green);
        }
        .initial-credit {
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-right: auto;
        }

        .btn-withdraw {
            width: 100%;
            padding: 14px;
            background: var(--btn-gradient);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 136, 204, 0.3);
        }

        /* Grid Stats */
        .grid-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .stat-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid var(--border-color);
        }
        .stat-title {
            color: var(--text-sub);
            font-size: 0.8rem;
            margin-bottom: 8px;
        }
        .stat-value {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--green);
            margin-bottom: 4px;
        }
        .stat-irr {
            font-size: 0.75rem;
            color: var(--text-sub);
            margin-bottom: 4px;
        }
        .stat-perc {
            font-size: 0.75rem;
            color: var(--green);
            font-weight: bold;
        }

        /* Chart Section */
        .chart-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid var(--border-color);
        }
        .chart-title {
            font-size: 0.95rem;
            font-weight: bold;
            color: var(--text-main);
            margin-bottom: 12px;
        }

        /* Bottom Navbar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 65px;
            background-color: var(--card-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }
        .nav-item {
            text-align: center;
            color: var(--text-sub);
            font-size: 0.7rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }
        .nav-item.active {
            color: var(--accent-blue);
        }
        .nav-icon {
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <span class="header-title">⚙️ معامله‌گر خودکار بهروز</span>
    </div>

    <div class="dashboard-title-section">
        <h1 class="dashboard-title">داشبورد</h1>
    </div>

    <div class="container">
        <!-- Balance Card -->
        <div class="balance-card">
            <div class="balance-header">
                <span>موجودی</span>
                <span>💳</span>
            </div>
            <div class="balance-value">267.88$</div>
            <div class="balance-irr">≈ 52,113,000 تومان</div>
            
            <div class="balance-badges">
                <span class="badge badge-green">↗ +167.88$ (+167.9%)</span>
                <span class="initial-credit">اعتبار اولیه: 100.00$</span>
            </div>
            
            <button class="btn-withdraw">📥 برداشت موجودی</button>
        </div>

        <!-- Grid Stats -->
        <div class="grid-stats">
            <!-- Today PnL -->
            <div class="stat-card">
                <div class="stat-title">سود/زیان امروز</div>
                <div class="stat-value">+22.96$</div>
                <div class="stat-irr">+ 4,467,000 تومان</div>
                <div class="stat-perc">+167.9%</div>
            </div>

            <!-- Total PnL -->
            <div class="stat-card">
                <div class="stat-title">سود/زیان کل</div>
                <div class="stat-value">+167.88$</div>
                <div class="stat-irr">+ 32,659,000 تومان</div>
                <div class="stat-perc">+167.9%</div>
            </div>
        </div>

        <!-- Chart Card -->
        <div class="chart-card">
            <div class="chart-title">نمودار رشد حساب</div>
            <canvas id="growthChart" height="150"></canvas>
        </div>
    </div>

    <!-- Spacer for Bottom Nav -->
    <div style="height: 85px;"></div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <div class="nav-item active">
            <div class="nav-icon">🎛️</div>
            <div>داشبورد</div>
        </div>
        <div class="nav-item">
            <div class="nav-icon">📈</div>
            <div>معاملات</div>
        </div>
        <div class="nav-item">
            <div class="nav-icon">👛</div>
            <div>کیف پول</div>
        </div>
        <div class="nav-item">
            <div class="nav-icon">❓</div>
            <div>سوالات متداول</div>
        </div>
        <div class="nav-item">
            <div class="nav-icon">⚙️</div>
            <div>بیشتر</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Growth Chart Setup
        const ctx = document.getElementById('growthChart').getContext('2d');
        
        // Gradient for Chart Background
        const gradient = ctx.createLinearGradient(0, 0, 0, 150);
        gradient.addColorStop(0, 'rgba(0, 136, 204, 0.4)');
        gradient.addColorStop(1, 'rgba(0, 136, 204, 0.0)');

        new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['روز ۱', 'روز ۲', 'روز ۳', 'روز ۴', 'روز ۵', 'روز ۶', 'امروز'],
                datasets: [{
                    data: [100, 120, 115, 160, 190, 220, 267.88],
                    borderColor: '#0088cc',
                    borderWidth: 3,
                    fill: true,
                    backgroundColor: gradient,
                    tension: 0.4,
                    pointRadius: 0
                }]
            },
            options: {
                responsive: true,
                plugins: { legend: { display: false } },
                scales: {
                    x: { display: false },
                    y: { 
                        grid: { color: '#1e2d3b' },
                        ticks: { color: '#8a9ba8', font: { size: 10 } }
                    }
                }
            }
        });
    </script>
</body>
</html>
