<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Dashboard</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #3b82f6;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --green: #22c55e;
            --red: #ef4444;
            --border: #334155;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 12px;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .user-badge {
            background: var(--card-bg);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: var(--accent-blue);
            border: 1px solid var(--border);
        }

        .auth-status {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid var(--green);
            color: var(--green);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }
        .stat-card {
            background: var(--card-bg);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        .stat-title {
            font-size: 0.75rem;
            color: var(--text-sub);
            margin-bottom: 4px;
        }
        .stat-value {
            font-size: 1.1rem;
            font-weight: bold;
        }

        .nav-tabs {
            display: flex;
            background: var(--card-bg);
            padding: 4px;
            border-radius: 10px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
        }
        .tab-btn {
            flex: 1;
            padding: 8px;
            text-align: center;
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 0.85rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }
        .tab-btn.active {
            background: var(--accent-blue);
            color: white;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 14px;
            border: 1px solid var(--border);
            margin-bottom: 12px;
        }
        .card-title {
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }

        .form-group { margin-bottom: 12px; }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-bottom: 4px;
        }
        .form-control {
            width: 100%;
            padding: 8px 12px;
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            box-sizing: border-box;
        }

        .btn-main {
            width: 100%;
            padding: 12px;
            background: var(--accent-blue);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <span style="font-weight: bold; font-size: 1.1rem;">⚡ داشبورد معاملاتی</span>
        <span class="user-badge" id="username">کاربر</span>
    </div>

    <!-- Phone Verification Status -->
    <div class="auth-status">
        <span>پروفایل تایید شده</span>
        <strong id="user-phone">در حال دریافت شماره...</strong>
    </div>

    <!-- Quick Stats -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-title">موجودی (USDT)</div>
            <div class="stat-value" id="balance">$1,000.00</div>
        </div>
        <div class="stat-card">
            <div class="stat-title">سود/زیان کل</div>
            <div class="stat-value" style="color: var(--green);" id="pnl">+$0.00</div>
        </div>
    </div>

    <!-- Navigation -->
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('dashboard')">اصلی</button>
        <button class="tab-btn" onclick="switchTab('settings')">تنظیمات</button>
    </div>

    <!-- Tab 1: Dashboard -->
    <div id="tab-dashboard" class="tab-content active">
        <div class="card">
            <div class="card-title">
                <span>وضعیت اتصال به سیستم</span>
                <span style="color: var(--green); font-size: 0.8rem;">● آماده دریافت سیگنال</span>
            </div>
            <button class="btn-main" style="background: var(--red);" id="toggleBotBtn">توقف ربات</button>
        </div>
    </div>

    <!-- Tab 2: Settings -->
    <div id="tab-settings" class="tab-content">
        <div class="card">
            <div class="card-title">تنظیمات حساب و ورود</div>
            <div class="form-group">
                <label>شماره موبایل ثبت شده</label>
                <input type="text" id="phone-input" class="form-control" readonly>
            </div>
            <div class="form-group">
                <label>حجم معامله (USDT)</label>
                <input type="number" class="form-control" value="50">
            </div>
            <button class="btn-main">ذخیره تغییرات</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            document.getElementById('username').innerText = user.first_name || 'کاربر';
            
            // گرفتن شماره تلفن در صورت وجود در دیتا
            if (user.phone_number) {
                document.getElementById('user-phone').innerText = '+' + user.phone_number;
                document.getElementById('phone-input').value = '+' + user.phone_number;
            } else {
                document.getElementById('user-phone').innerText = 'تایید شده با تلگرام';
                document.getElementById('phone-input').value = 'ارسال شده به ربات';
            }
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById('tab-' + tabName).classList.add('active');
            event.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
